name: Scale comparison

on:
  push:
    branches: [feat/performance-comparisons]
    paths:
      - '.github/workflows/scale.yml'
      - 'benchmark/**'
      - 'Dockerfile'
      - 'sql/**'
  workflow_dispatch:
    inputs:
      dataset:
        description: "Seed records"
        required: true
        default: "1000000"
        type: choice
        options: ["1000000", "5000000"]
      duration:
        description: "Seconds per load scenario"
        required: true
        type: choice
        default: "8"
        options: ["8", "15", "30"]

permissions:
  contents: read

jobs:
  scale:
    strategy:
      fail-fast: false
      matrix:
        seed_rows: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('[{0}]', inputs.dataset) || '[1000000,5000000]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      DATABASE_URL: postgresql://bench:bench@localhost:5432/bench
      SEED_ROWS: ${{ matrix.seed_rows }}
      DURATION: ${{ inputs.duration || '8' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Runner resources
        run: |
          nproc
          free -h
          df -h .
      - name: Database
        run: docker compose up -d --build --wait
      - name: Python dependencies
        run: python -m pip install -r benchmark/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s benchmark -p 'test_*.py'
      - name: Seed records and build HNSW index
        run: |
          python benchmark/run.py --rows "$SEED_ROWS" --output results/seed
          cat results/seed/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Compare throughput and query plans
        run: |
          python benchmark/compare.py --rates 1000,5000 --workers 2,4,8 --duration "$DURATION" --output results/comparison
          cat results/comparison/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Database logs on failure
        if: failure()
        run: docker compose logs --no-color > postgres.log || true
      - name: Upload reports and charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale-${{ matrix.seed_rows }}-results
          path: |
            results/
            postgres.log
          if-no-files-found: warn
