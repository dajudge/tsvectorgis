name: Benchmark

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rows:
        description: "Seed telemetry records"
        required: true
        type: choice
        default: "100000"
        options: ["100000", "1000000", "5000000"]
      ingest_rate:
        description: "Continuous COPY rows/second"
        required: true
        type: choice
        default: "500"
        options: ["100", "500", "1000", "2000", "5000"]
      duration:
        description: "Seconds per phase (two phases)"
        required: true
        type: choice
        default: "15"
        options: ["15", "30", "60"]
      query_workers:
        description: "Concurrent query workers"
        required: true
        type: choice
        default: "2"
        options: ["1", "2", "4", "8"]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://bench:bench@localhost:5432/bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and start PostgreSQL
        run: docker compose up --build --detach --wait
      - name: Install benchmark client
        run: python -m pip install -r benchmark/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s benchmark -p 'test_*.py'
      - name: Bulk seed benchmark
        env:
          BENCH_ROWS: ${{ github.event.inputs.rows || '100000' }}
        run: |
          python benchmark/run.py --rows "$BENCH_ROWS" --output results/bulk
          cat results/bulk/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Ingest-only baseline, then concurrent ingest and queries
        env:
          INGEST_RATE: ${{ github.event.inputs.ingest_rate || '500' }}
          DURATION: ${{ github.event.inputs.duration || '15' }}
          QUERY_WORKERS: ${{ github.event.inputs.query_workers || '2' }}
        run: |
          python benchmark/continuous.py --duration "$DURATION" --ingest-rate "$INGEST_RATE" --query-workers 0 --output results/ingest-only
          python benchmark/continuous.py --duration "$DURATION" --ingest-rate "$INGEST_RATE" --query-workers "$QUERY_WORKERS" --output results/concurrent
          cat results/ingest-only/summary.md >> "$GITHUB_STEP_SUMMARY"
          cat results/concurrent/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comparison smoke test and charts
        run: |
          python benchmark/compare.py --rates 500 --workers 2 --strategies auto,spatial,hnsw --duration 4 --output results/comparison
          cat results/comparison/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Database logs on failure
        if: failure()
        run: docker compose logs --no-color > postgres.log || true
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            results/
            postgres.log
          if-no-files-found: warn
