name: Benchmark

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rows:
        description: "Telemetry records"
        required: true
        type: choice
        default: "100000"
        options: ["100000", "1000000", "5000000"]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://bench:bench@localhost:5432/bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and start PostgreSQL
        run: docker compose up --build --detach --wait
      - name: Install benchmark client
        run: python -m pip install -r benchmark/requirements.txt
      - name: Benchmark
        env:
          BENCH_ROWS: ${{ github.event.inputs.rows || '100000' }}
        run: |
          python benchmark/run.py --rows "$BENCH_ROWS" --output results
          cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Database logs on failure
        if: failure()
        run: docker compose logs --no-color > postgres.log || true
      - name: Upload results and query plans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            results/
            postgres.log
          if-no-files-found: warn
