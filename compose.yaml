services:
  db:
    build: .
    # PostgreSQL parallel queries use dynamic shared-memory segments.
    # Docker's default 64 MiB /dev/shm fails at 5M rows with 8 readers.
    shm_size: 1gb
    environment:
      POSTGRES_DB: bench
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      TIMESCALEDB_TELEMETRY: "off"
      NO_TS_TUNE: "true"
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
